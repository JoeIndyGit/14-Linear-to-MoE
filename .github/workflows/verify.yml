name: Verify submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate actual Jupyter outputs and measured documentation
        run: python build_artifacts.py
      - name: Refresh checksums for generated notebook outputs
        run: python scripts/update_manifest.py
      - name: Verify and reproduce every branch and singleton plots
        run: python check_submission.py --reproduce --check-singleton --execute-notebook
      - name: Retain executed notebook and generated report
        uses: actions/upload-artifact@v7
        with:
          name: executed-submission
          path: |
            linear_to_moe.ipynb
            README.md
            SUBMISSION.md
            docs/EXPERIMENT.md
            requirements.txt
            requirements-dev.txt
            results/notebook_execution.json
            results/verification.json
            results/comparison.csv
          if-no-files-found: error
