name: Verify submission

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned training and notebook dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Audit evidence, reproduce all cases, test singleton plots and execute notebook
        run: python check_submission.py --reproduce --check-singleton --execute-notebook
